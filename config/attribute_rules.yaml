# Phase 2 ABAC verdict-mapping rules for OrgAccess attribute checking.
# See docs/phase2/attribute-schema.md for the full explanation.

_PROVISIONAL: This severity mapping (core vs soft) is a PLACEHOLDER seeded from the OrgAccess paper's
  own wording (partial is reserved for location, collaboration, and ethical-guideline constraints; every
  other breach is rejected). The paper does not publish a formal field-by-field rule. The user is getting
  the authoritative mapping from the paper's author directly -- when that arrives, update ONLY the `severity`
  values below. No code changes are needed elsewhere; src/attribute_check.py reads this file at runtime.
default_severity: core

# Phase 3c self-evolving refinement (see docs/phase3/self-evolution.md) proposed flipping
# biometric_required from core to soft on 2026-09-29, based on a held-out-split validation
# (69.9% -> 70.6% on the `hard` split, reports/phase3c_refinement_report.json). A full 1,000-row
# re-run on 2026-09-30 (reports/full_eval_v2_updated_checkpoint.jsonl) found the change did NOT
# generalize -- 40.9% pooled vs. 41.5% on the original run, and 40.9% vs. 40.6% on a same-model
# (3B-only) comparison that isolates the rule change from a model-mix confound: a +0.3pp
# difference, within noise. Reverted back to core on 2026-09-30. Kept as a documented finding,
# not a live change -- see docs/phase3/self-evolution.md's "Result" section.
severity_meaning:
  core: A denied sub-ask governed by this field forces the whole query to REJECTED.
  soft: A denied sub-ask governed ONLY by soft fields (with no core violation) yields PARTIAL instead
    of REJECTED.
