# User → role mapping, built from OrgAccess dataset inspection (70,503 rows).
#
# user_role values from the dataset were grouped into the 20 canonical roles
# defined in permissions.yaml. One representative user is created per major
# user_role variant so pipeline tests can target specific personas.
#
# Naming convention: <first>.<OrgAccess_user_role>
# All role values must match a key defined in config/permissions.yaml.

