# OrgAccess-aligned permission map — updated from dataset inspection (70,503 rows).
#
# Resource IDs use "<department>.<action>" dot notation, directly mirroring the
# OrgAccess benchmark's schema: department controls WHAT data is touched,
# action controls HOW it is touched.
#
# Canonical departments (normalized from dataset variants):
#   hr, finance, it, marketing, sales, legal, engineering, compliance,
#   security, executive, operations, analytics, audit, research,
#   customer_support, product, risk
#
# Canonical actions (derived from allowed_actions frequencies):
#   view     — read / View / read_only / query_data / view_reports
#   edit     — write / Edit / update / modify
#   approve  — approve / Approve / approve_budgets / approve_leave_requests
#   delete   — delete / Delete / remove
#   audit    — audit_logs / audit_operations / Audit / view_logs
#   reports  — generate_reports / view_financial_reports / view_sales_data
#   export   — export_data / export / Export
#   admin    — admin / Administrator / modify_schema / manage_keys
#   deploy   — deploy_code / Execute / execute
#
# Resolution order (unchanged from Phase 1 design):
#   1. resource in denied_resources  → DENY  (explicit deny always wins)
#   2. resource in allowed_resources → ALLOW
#   3. no match                      → DENY  (default-deny / least privilege)
#
# Wildcards: "dept.*" matches any dept.anything; bare "*" matches everything.
# Explicit deny beats wildcard allow.

roles:

  # ── C-suite & VP ──────────────────────────────────────────────────────────
  executive:
    description: >
      C-suite executives and VPs (CEO, CFO, COO, CTO, VP_Engineering,
      VP_Sales, VP_HR, VP_Marketing, VP_Product, VP_Executive_Operations,
      Chief_Of_Staff, Field_Executive, Global_Marketing_Head,
